<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is about practice HTML, Divs, Button and others">
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <title>HTML Form </title>
</head>
<body>
    <h3 style="background-color: brown;text-align:center">Tour Regsitration Form </h3>

    <a href="https://www.facebook.com/mohammadtuhin0">visit this profile</a>

    <form action="https://www.facebook.com/mohammadtuhin0">

        <fieldset>
            <legend>Regsitration</legend>

            <label for="">First Name</label> <br>
            <input required type="text" placeholder="Enter your first name"> <br> <br>


            <label for="">Last Name</label> <br>
            <input required type="text" placeholder="Enter your last name"> <br> <br>


            <label for="">Enter your Email</label> <br>
            <input required type="email" placeholder="Enter your Email"> <br> <br>


            <label for="">Enter your age</label> <br>
            <input required type="number" placeholder="Enter your Age"> <br> <br>


            <label for="">Enter your Birthdate</label> <br>
            <input required type="date" placeholder="Enter your Birthdate"> <br> <br>


            <label for="">When you want to visit</label> <br>
            <input required type="month" placeholder="Enter visit month"> <br> <br>


            <label for="">Enter a Password</label> <br>
            <input required type="password" placeholder="Enter your password"> <br> <br>


            <label for="">Enter a Salary Range</label>
            <input type="range" min="0" max="100"> <br> <br>

            
            <label for="">Enter your Gender</label>
            <input type="radio" name="gender" value="gender"> Male <input type="radio" name="gender" value="gender">Female <br> <br>


            <label for="">Enter your Favourite Color</label> <br>
            <input required type="color"> <br> <br>


            <label for="">Enter your Bus</label> <br>
            <select name="" id="">
                <option disabled selected>Select your bus</option>
                <option value="Volvo Bus">Volvo Bus</option>
                <option value="Marcedes Bnch">Marcedes Bnch</option>
            </select> <br> <br>


            <label for="">Enter your image</label>
            <input type="file" name="" id=""> <br> <br>


            <textarea name="" id="" placeholder="write your Details here"></textarea> <br> 


            <button type="submit">Submit</button>
        </fieldset>
    </form>

</body>
</html>
